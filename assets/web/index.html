<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Calendar App - Extiro AI</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="bg-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <div class="calendar-container">
        <!-- Sidebar / Event Panel -->
        <div class="sidebar">
            <div class="logo">
                <i class="fa-solid fa-cube"></i>
                <span>3D Calendar</span>
            </div>
            <div class="current-date-display">
                <h2 id="sidebar-day">12</h2>
                <p id="sidebar-weekday">Monday</p>
                <p id="sidebar-date-full">October 12, 2023</p>
            </div>
            
            <div class="events-section">
                <h3><i class="fa-solid fa-bookmark"></i> Events</h3>
                <div id="events-list" class="events-list">
                    <!-- Dynamic events -->
                </div>
                <div class="add-event-form">
                    <input type="text" id="event-input" placeholder="Add new event...">
                    <button id="add-event-btn"><i class="fa-solid fa-plus"></i></button>
                </div>
            </div>

            <div class="creator-tag">
                Created with Extiro AI
            </div>
        </div>

        <!-- Main 3D Calendar View -->
        <div class="main-calendar">
            <header class="calendar-header">
                <div class="month-year">
                    <h1 id="month-year-display">October 2023</h1>
                </div>
                <div class="calendar-nav">
                    <button id="prev-btn" class="nav-btn"><i class="fa-solid fa-chevron-left"></i></button>
                    <button id="today-btn" class="nav-btn today">Today</button>
                    <button id="next-btn" class="nav-btn"><i class="fa-solid fa-chevron-right"></i></button>
                </div>
            </header>

            <div class="weekdays-grid">
                <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
            </div>

            <div class="days-grid-wrapper">
                <div id="days-grid" class="days-grid">
                    <!-- Dynamic calendar days -->
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
