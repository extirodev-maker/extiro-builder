name: Build Flutter APK
on:
  workflow_dispatch:
    inputs:
      project_zip_key:
        required: true
      build_id:
        required: true
      app_name:
        default: 'app'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Download project
        run: |
          curl -L "${{ secrets.R2_PUBLIC_URL }}/${{ inputs.project_zip_key }}" -o project.zip
          unzip -q project.zip -d project
      - name: Build APK
        working-directory: project
        run: flutter build apk --release
      - name: Upload APK to R2
        working-directory: project
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          BUILD_ID: ${{ inputs.build_id }}
          APP_NAME: ${{ inputs.app_name }}
        run: |
          curl https://rclone.org/install.sh | sudo bash
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = $R2_ACCESS_KEY
          secret_access_key = $R2_SECRET_KEY
          endpoint = https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com
          EOF
          rclone copy build/app/outputs/flutter-apk/app-release.apk r2:$R2_BUCKET/apks/${APP_NAME}-${BUILD_ID}.apk
